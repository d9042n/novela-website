      <!-- Google Fonts nạp qua <link>, KHÔNG qua @import trong CSS: fonts.css được

           không còn ở đầu file -> vị trí không hợp lệ -> bundler bỏ luôn, prod mất
           @font-face và rơi về Georgia. Dev không bundle nên không lộ lỗi này. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
