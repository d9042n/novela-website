# Cấu hình Nginx cho novela-website (React SPA static serving).
# Xử lý client-side routing fallback (try_files -> /index.html),
# tối ưu cache static assets /assets/ và cung cấp endpoint /healthz cho K8s.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression giúp giảm băng thông nén JS/CSS/SVG
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers chuẩn OWASP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing fallback: Nếu không tìm thấy file thật, điều hướng về index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache mạnh 1 năm cho các asset hashed (/assets/index-*.js, *.css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Healthcheck endpoint cho K8s Liveness/Readiness probes (trả về 200 OK ngay)
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /5x.x.html;
    location = /5x.x.html {
        root /usr/share/nginx/html;
    }
}
